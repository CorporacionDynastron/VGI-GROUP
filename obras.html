<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Obras - VGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#F2CA50",
                        "primary-fixed": "#FFE178",
                        secondary: "#D1C5B4",
                        background: "#1c1b1f",
                        surface: "#1c1b1f",
                        "surface-dim": "#141317",
                        "surface-container-lowest": "#0f0e11",
                        "surface-container-low": "#1c1b1f",
                        "surface-container": "#201f23",
                        "surface-container-high": "#2b2a2e",
                        "surface-container-highest": "#363439",
                        "on-surface": "#e6e1e5",
                        "on-surface-variant": "#cac4d0",
                        "outline": "#938f99",
                        "outline-variant": "#49454f"
                    },
                    fontFamily: {
                        "headline-lg": ['Syne', 'sans-serif'],
                        "headline-sm": ['Syne', 'sans-serif'],
                        "body-md": ['Inter', 'sans-serif'],
                        "body-sm": ['Inter', 'sans-serif'],
                    },
                    spacing: {
                        "gutter": "2rem",
                        "gutter-lg": "4rem",
                        "space-sm": "0.5rem",
                        "space-md": "1rem",
                        "space-lg": "2rem",
                        "space-xl": "4rem",
                        "space-2xl": "8rem"
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overscroll-behavior: none; }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen">
    
    <script src="header.js"></script>

    <main class="w-full pt-0 bg-surface min-h-[calc(100vh-20rem)] flex flex-col">
        <!-- HERO -->
        <section class="relative w-full h-[50vh] min-h-[400px] flex flex-col items-center justify-center overflow-hidden border-b border-outline-variant/20">
            <div class="absolute inset-0 z-0">
                <img src="./02-pistas/IMAGEN%201.webp" alt="Obras Ejecutadas" class="w-full h-full object-cover opacity-30 brightness-110 object-center">
                <div class="absolute inset-0 bg-gradient-to-b from-surface/20 via-surface/60 to-surface"></div>
            </div>
            
            <div class="max-w-7xl mx-auto px-gutter relative z-10 w-full flex flex-col justify-center text-center">
                <h1 class="font-headline-lg text-4xl md:text-6xl text-white uppercase tracking-tight font-bold drop-shadow-lg mb-4">
                    Nuestras <span class="text-primary">Obras</span>
                </h1>
                <p class="font-body-md text-secondary text-lg max-w-2xl mx-auto">
                    Clasificación general de obras en cartera de VGI.
                </p>
            </div>
        </section>

        <!-- LIST SECTION -->
        <section class="w-full bg-surface py-space-xl relative">
            <div class="max-w-5xl mx-auto px-gutter">
                <div class="flex flex-col gap-8">
                    <!-- 1 -->
                    <div class="relative group bg-surface-container-low border border-outline-variant/20 flex flex-col md:flex-row items-stretch shadow-lg overflow-hidden transition-all duration-300 hover:border-primary/50 hover:bg-surface-container cursor-pointer">
                        <div class="relative p-8 md:w-1/2 flex items-center overflow-hidden">
                            <div class="absolute -left-4 -top-8 text-9xl font-headline-lg font-bold text-primary opacity-[0.03] group-hover:opacity-10 transition-opacity duration-300 pointer-events-none select-none">
                                01
                            </div>
                            <div class="relative z-10 flex items-center gap-6">
                                <div class="text-5xl font-headline-lg font-bold text-primary drop-shadow-sm">01.</div>
                                <h2 class="text-2xl md:text-3xl font-headline-sm uppercase font-bold text-on-surface group-hover:text-primary transition-colors">Obras de edificaciones y afines</h2>
                            </div>
                        </div>
                        <div class="md:w-1/2 h-64 md:h-auto relative overflow-hidden">
                            <img src="./08-multifamiliar/primera-piedra/PRIMERA_PIEDRA_1.webp" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" alt="Edificaciones">
                            <div class="absolute inset-0 bg-gradient-to-r from-surface-container-low to-transparent hidden md:block"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent md:hidden"></div>
                        </div>
                    </div>
                    <!-- 2 -->
                    <div class="relative group bg-surface-container-low border border-outline-variant/20 flex flex-col md:flex-row-reverse items-stretch shadow-lg overflow-hidden transition-all duration-300 hover:border-primary/50 hover:bg-surface-container cursor-pointer">
                        <div class="relative p-8 md:w-1/2 flex items-center overflow-hidden">
                            <div class="absolute -right-4 -top-8 text-9xl font-headline-lg font-bold text-primary opacity-[0.03] group-hover:opacity-10 transition-opacity duration-300 pointer-events-none select-none">
                                02
                            </div>
                            <div class="relative z-10 flex items-center gap-6 w-full justify-start md:justify-end text-left md:text-right">
                                <h2 class="text-2xl md:text-3xl font-headline-sm uppercase font-bold text-on-surface group-hover:text-primary transition-colors">Obras viales, puertos y afines</h2>
                                <div class="text-5xl font-headline-lg font-bold text-primary drop-shadow-sm">02.</div>
                            </div>
                        </div>
                        <div class="md:w-1/2 h-64 md:h-auto relative overflow-hidden">
                            <img src="./02-pistas/IMAGEN%209.webp" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" alt="Viales">
                            <div class="absolute inset-0 bg-gradient-to-l from-surface-container-low to-transparent hidden md:block"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent md:hidden"></div>
                        </div>
                    </div>
                    <!-- 3 -->
                    <div class="relative group bg-surface-container-low border border-outline-variant/20 flex flex-col md:flex-row items-stretch shadow-lg overflow-hidden transition-all duration-300 hover:border-primary/50 hover:bg-surface-container cursor-pointer">
                        <div class="relative p-8 md:w-1/2 flex items-center overflow-hidden">
                            <div class="absolute -left-4 -top-8 text-9xl font-headline-lg font-bold text-primary opacity-[0.03] group-hover:opacity-10 transition-opacity duration-300 pointer-events-none select-none">
                                03
                            </div>
                            <div class="relative z-10 flex items-center gap-6">
                                <div class="text-5xl font-headline-lg font-bold text-primary drop-shadow-sm">03.</div>
                                <h2 class="text-2xl md:text-3xl font-headline-sm uppercase font-bold text-on-surface group-hover:text-primary transition-colors">Obras de saneamiento y afines</h2>
                            </div>
                        </div>
                        <div class="md:w-1/2 h-64 md:h-auto relative overflow-hidden">
                            <img src="./07-saneamiento/saneamiento_1.jpg" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" alt="Saneamiento">
                            <div class="absolute inset-0 bg-gradient-to-r from-surface-container-low to-transparent hidden md:block"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent md:hidden"></div>
                        </div>
                    </div>
                    <!-- 4 -->
                    <div class="relative group bg-surface-container-low border border-outline-variant/20 flex flex-col md:flex-row-reverse items-stretch shadow-lg overflow-hidden transition-all duration-300 hover:border-primary/50 hover:bg-surface-container cursor-pointer">
                        <div class="relative p-8 md:w-1/2 flex items-center overflow-hidden">
                            <div class="absolute -right-4 -top-8 text-9xl font-headline-lg font-bold text-primary opacity-[0.03] group-hover:opacity-10 transition-opacity duration-300 pointer-events-none select-none">
                                04
                            </div>
                            <div class="relative z-10 flex items-center gap-6 w-full justify-start md:justify-end text-left md:text-right">
                                <h2 class="text-2xl md:text-3xl font-headline-sm uppercase font-bold text-on-surface group-hover:text-primary transition-colors">Obras electromecánicas, energéticas, telecom. y afines</h2>
                                <div class="text-5xl font-headline-lg font-bold text-primary drop-shadow-sm">04.</div>
                            </div>
                        </div>
                        <div class="md:w-1/2 h-64 md:h-auto relative overflow-hidden">
                            <img src="./images/imagen-6.jpeg" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" alt="Electromecanicas">
                            <div class="absolute inset-0 bg-gradient-to-l from-surface-container-low to-transparent hidden md:block"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent md:hidden"></div>
                        </div>
                    </div>
                    <!-- 5 -->
                    <div class="relative group bg-surface-container-low border border-outline-variant/20 flex flex-col md:flex-row items-stretch shadow-lg overflow-hidden transition-all duration-300 hover:border-primary/50 hover:bg-surface-container cursor-pointer">
                        <div class="relative p-8 md:w-1/2 flex items-center overflow-hidden">
                            <div class="absolute -left-4 -top-8 text-9xl font-headline-lg font-bold text-primary opacity-[0.03] group-hover:opacity-10 transition-opacity duration-300 pointer-events-none select-none">
                                05
                            </div>
                            <div class="relative z-10 flex items-center gap-6">
                                <div class="text-5xl font-headline-lg font-bold text-primary drop-shadow-sm">05.</div>
                                <h2 class="text-2xl md:text-3xl font-headline-sm uppercase font-bold text-on-surface group-hover:text-primary transition-colors">Obras de represas, irrigaciones y afines</h2>
                            </div>
                        </div>
                        <div class="md:w-1/2 h-64 md:h-auto relative overflow-hidden">
                            <img src="./01-recreacion/IMAGEN%201.webp" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" alt="Represas">
                            <div class="absolute inset-0 bg-gradient-to-r from-surface-container-low to-transparent hidden md:block"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent md:hidden"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <script src="footer.js"></script>
</body>
</html>
